<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Image Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        .grid-background {
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px), linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .fullscreen-overlay img {
            max-width: 90%;
            max-height: 90%;
        }
    </style>
</head>
<body class="bg-gray-100 grid-background" onload="checkAuth()">
    <header class="bg-white shadow">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="text-2xl font-bold text-gray-800">Image Gallery</div>
                <nav class="flex space-x-4">
                    <a class="text-gray-800 hover:text-gray-600" href="#">Home</a>
                    <a class="text-gray-800 hover:text-gray-600" href="#">Gallery</a>
                    <a class="text-gray-800 hover:text-gray-600" href="#">Upload</a>
                    <a class="text-gray-800 hover:text-gray-600" href="#">Contact</a>
                </nav>
            </div>
        </div>
    </header>
    <main class="container mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Gallery</h1>
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" style="background-color: white;">
            <!-- Images will be displayed here after upload -->
        </div>
        <div class="mt-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Upload an Image</h2>
            <form action="upload.php" method="POST" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow-md" id="upload-form">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="file-upload">Choose an image to upload:</label>
                    <input accept="image/*" class="w-full px-3 py-2 border rounded-lg mb-4" id="file-upload" name="file-upload" type="file"/>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="image-caption">Image Caption:</label>
                    <input class="w-full px-3 py-2 border rounded-lg" id="image-caption" name="image-caption" type="text" placeholder="Enter a caption for this image"/>
                </div>
                <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-700" type="submit">Upload</button>
            </form>
        </div>
    </main>
    <footer class="bg-white shadow mt-8">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="text-gray-800">© 2023 Image Gallery. All rights reserved.</div>
                <div class="flex space-x-4">
                    <a class="text-gray-800 hover:text-gray-600" href="#"><i class="fab fa-facebook"></i></a>
                    <a class="text-gray-800 hover:text-gray-600" href="#"><i class="fab fa-twitter"></i></a>
                    <a class="text-gray-800 hover:text-gray-600" href="#"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>
    </footer>
    <div class="fullscreen-overlay" id="fullscreen-overlay">
        <img alt="Full screen view of the selected image" id="fullscreen-image" src=""/>
    </div>
    <script>
        function checkAuth() {
            if(!localStorage.getItem('isAuthenticated')) {
                window.location.href = 'login.html';
            }
        }
        document.getElementById('upload-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const fileInput = document.getElementById('file-upload');
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const caption = document.getElementById('image-caption').value || 'No caption';
                    const gallery = document.getElementById('gallery');
                    const div = document.createElement('div');
                    div.className = 'bg-white rounded-lg shadow-md overflow-hidden relative';
                    div.innerHTML = `
                        <img src="${e.target.result}" alt="Uploaded image" class="w-full h-48 object-cover" />
                        <div class="p-4">
                            <p class="text-gray-600 font-medium">${caption}</p>
                        </div>
                        <button class="absolute top-2 right-2 bg-red-500 text-white px-2 py-1 rounded-full hover:bg-red-700 delete-btn">
                            <i class="fas fa-trash"></i>
                        </button>
                    `;
                    gallery.appendChild(div);

                    div.querySelector('.delete-btn').addEventListener('click', function() {
                        gallery.removeChild(div);
                    });

                    div.querySelector('img').addEventListener('dblclick', function() {
                        const fullscreenOverlay = document.getElementById('fullscreen-overlay');
                        const fullscreenImage = document.getElementById('fullscreen-image');
                        fullscreenImage.src = e.target.result;
                        fullscreenOverlay.style.display = 'flex';
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('fullscreen-overlay').addEventListener('click', function() {
            this.style.display = 'none';
        });
    </script>
</body>
</html>
